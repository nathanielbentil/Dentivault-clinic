<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Enterprise Security System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container"></div>
  </nav>

  <main class="container" style="padding-top: 3rem; padding-bottom: 4rem; display: flex; justify-content: center;">
    <div style="max-width: 480px; width: 100%;">
      <div class="card">
        <div class="card-header" style="text-align: center; display: block;">
          <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 2.75rem; height: 2.75rem; font-size: 1.4rem;">
            🔐
          </div>
          <h2 class="card-title">Enterprise Sign In</h2>
          <p class="card-subtitle">Protected by Argon2id + Pepper & Sliding Account Lockout</p>
        </div>

        <!-- 1-Click Fast Fill for Viva Demonstration -->
        <div style="background: rgba(31, 41, 55, 0.6); padding: 0.85rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 1.5rem;">
          <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase;">
            ⚡ Quick Test Credentials (1-Click Fill)
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <button type="button" onclick="fillCredentials('admin@secureauth.com', 'Admin@SecureAuth2026!')" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 0.75rem;">
              👑 Fill Admin
            </button>
            <button type="button" onclick="fillCredentials('user@secureauth.com', 'User@SecureAuth2026!')" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 0.75rem;">
              👤 Fill User
            </button>
          </div>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="user@secureauth.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
              <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
            </div>
            <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
          </div>

          <div id="error-alert" style="display: none; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;">
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
            Sign In to Secure Console
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
          Need an account? <a href="register.html" style="color: var(--accent-cyan); text-decoration: none; font-weight: 500;">Register New Account</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    function fillCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('error-alert').style.display = 'none';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');
      const errorAlert = document.getElementById('error-alert');

      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Authenticating...';

      const response = await apiRequest('auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password }),
        skipAuthRedirect: true
      });

      submitBtn.disabled = false;
      submitBtn.innerText = 'Sign In to Secure Console';

      if (response.ok && response.data.success) {
        if (response.data.two_factor_required) {
          // 2FA Challenge required
          localStorage.setItem('secureauth_2fa_token', response.data.temp_token);
          showToast('2FA Required: Enter your TOTP code.', 'info');
          setTimeout(() => {
            window.location.href = 'two-factor.html';
          }, 600);
          return;
        }

        // Direct Login Success
        Auth.setToken(response.data.token);
        Auth.setUser(response.data.user);
        showToast('Authentication successful!', 'success');

        setTimeout(() => {
          if (response.data.user.is_admin) {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 600);
      } else {
        const errorMsg = response.data.message || 'Authentication failed. Please check credentials.';
        errorAlert.innerText = errorMsg;
        errorAlert.style.display = 'block';
        showToast(errorMsg, 'error');
      }
    });
  </script>
</body>
</html>
